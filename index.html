<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Services Directory</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- App CSS -->
    <link rel="stylesheet" href="./styles.css" />
    <meta name="description" content="Professional services directory with search and details popups." />
  </head>
  <body>
    <!-- Header -->
    <header class="app-hero border-bottom">
      <nav class="navbar navbar-expand-lg container">
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="#">
          <span class="brand-mark">?</span>
          <span>Acme Services</span>
        </a>
      </nav>
      <div class="container py-4 py-md-5">
        <div class="row align-items-center g-4">
          <div class="col-12 col-lg-7">
            <h1 class="display-5 fw-bold mb-3">Discover services that move your business forward</h1>
            <p class="lead text-body-secondary mb-0">Search our curated catalog and explore details in a click.</p>
          </div>
          <div class="col-12 col-lg-5">
            <div class="search-card p-3 p-md-4 shadow-sm rounded-4 bg-white">
              <label for="searchInput" class="form-label fw-semibold mb-2">Search services</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-white border-end-0" id="searchIcon" aria-hidden="true">??</span>
                <input id="searchInput" type="search" class="form-control border-start-0" placeholder="Try 'cloud', 'security', or 'design'" autocomplete="off" />
              </div>
              <div class="d-flex justify-content-between align-items-center mt-2 small text-body-secondary">
                <span id="resultsCount" aria-live="polite"></span>
                <span>Press ? to open highlighted</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Services Grid -->
    <main class="container my-5">
      <div id="servicesContainer" class="row g-4" aria-live="polite"></div>
    </main>

    <!-- Modal Template -->
    <div class="modal fade" id="serviceModal" tabindex="-1" aria-labelledby="serviceModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4 overflow-hidden">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title" id="serviceModalLabel">Service</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-0">
            <div class="d-flex align-items-start gap-3 mb-3">
              <div id="serviceIcon" class="service-icon-lg" aria-hidden="true">??</div>
              <div>
                <div id="serviceTags" class="mb-2"></div>
                <p id="serviceDescription" class="mb-0"></p>
              </div>
            </div>
            <hr />
            <div id="serviceLong" class="text-body-secondary"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            <a id="serviceCTA" href="#" class="btn btn-primary" target="_blank" rel="noopener">Contact sales</a>
          </div>
        </div>
      </div>
    </div>

    <footer class="container py-5 small text-body-secondary">
      <hr class="mb-3" />
      <div class="d-flex justify-content-between flex-wrap gap-2">
        <span>? <span id="year"></span> Acme Inc.</span>
        <span>Built with Bootstrap 5</span>
      </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- App JS -->
    <script src="./script.js"></script>
  </body>
</html>
